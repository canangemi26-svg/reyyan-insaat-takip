<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reyyan İnşaat Takip</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#1f2937}
header{background:#17202a;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:21px}.wrap{max-width:1180px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 5px 20px #0000000b;margin-bottom:18px}
input,select,textarea,button{width:100%;padding:11px;border:1px solid #d7dce2;border-radius:9px;font:inherit}textarea{min-height:90px}
button{background:#17202a;color:#fff;border:0;cursor:pointer;font-weight:600}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{font-size:13px;font-weight:600;display:block;margin-bottom:5px}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tabs button{width:auto;white-space:nowrap}.tabs button.active{background:#7a5c38}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid #edf0f3;text-align:left;font-size:13px}th{color:#6b7280}
.muted{color:#6b7280;font-size:13px}.hidden{display:none}.login{max-width:420px;margin:10vh auto}.msg{padding:10px;border-radius:9px;background:#fff4e5;margin:10px 0;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;padding:16px;border-radius:12px}.stat b{display:block;font-size:25px;margin-top:5px}
@media(max-width:700px){.grid,.stats{grid-template-columns:1fr}header{padding:15px}.wrap{margin:15px auto}}
</style>
</head>
<body>
<div id="login" class="login card">
<h1>Reyyan İnşaat Takip</h1><p class="muted">Ortak kullanım sistemi</p>
<div id="loginMsg"></div>
<label>E-posta</label><input id="email" type="email" autocomplete="username">
<label style="margin-top:10px">Şifre</label><input id="password" type="password" autocomplete="current-password">
<button id="loginBtn" style="margin-top:14px">Giriş Yap</button>
</div>

<div id="app" class="hidden">
<header><h1>Reyyan İnşaat Takip</h1><button id="logout" style="width:auto">Çıkış</button></header>
<div class="wrap">
<div class="stats">
<div class="stat">Müşteriler<b id="countCustomers">0</b></div>
<div class="stat">Projeler<b id="countProjects">0</b></div>
<div class="stat">Satışlar<b id="countSales">0</b></div>
</div>
<div class="tabs">
<button data-tab="customers">Müşteriler</button><button data-tab="projects">Projeler</button>
<button data-tab="sales">Satışlar</button><button data-tab="payments">Ödemeler</button>
<button data-tab="communications">Görüşmeler</button><button data-tab="requests">Talepler / Şikâyetler</button>
<button data-tab="after_sales">Teslimat / Satış Sonrası</button>
</div>
<div id="panel" class="card"></div>
</div></div>

<script>
const C=window.REYYAN_CONFIG;
let client=null,currentTab="customers";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function loginMsg(t){$("loginMsg").innerHTML='<div class="msg">'+esc(t)+'</div>'}

const defs={
customers:{title:"Müşteriler",table:"customers",fields:[["full_name","Ad Soyad","text",1],["phone","Telefon","text"],["email","E-posta","email"],["notes","Notlar","textarea"]],cols:["full_name","phone","email","notes"]},
projects:{title:"Projeler",table:"projects",fields:[["project_name","Proje Adı","text",1],["location","Lokasyon","text"],["status","Durum","text"],["notes","Notlar","textarea"]],cols:["project_name","location","status","notes"]},
sales:{title:"Satışlar",table:"sales",fields:[["customer_id","Müşteri ID","text",1],["project_id","Proje ID","text",1],["property_name","Bağımsız Bölüm / Gayrimenkul","text",1],["sale_price","Satış Fiyatı","number",1],["sale_date","Satış Tarihi","date",1],["payment_status","Ödeme Durumu","text"],["notes","Notlar","textarea"]],cols:["property_name","sale_price","sale_date","payment_status","notes"]},
payments:{title:"Ödemeler",table:"payments",fields:[["sale_id","Satış ID","text",1],["customer_id","Müşteri ID","text",1],["amount","Tutar","number",1],["due_date","Vade Tarihi","date",1],["paid_date","Ödeme Tarihi","date"],["status","Durum","text",1],["payment_method","Ödeme Yöntemi","text"],["notes","Notlar","textarea"]],cols:["amount","due_date","paid_date","status","payment_method","notes"]},
communications:{title:"Görüşmeler",table:"communications",fields:[["customer_id","Müşteri ID","text",1],["communication_type","Görüşme Türü","text",1],["communication_date","Tarih","datetime-local"],["subject","Konu","text"],["notes","Notlar","textarea"]],cols:["communication_type","communication_date","subject","notes"]},
requests:{title:"Talepler / Şikâyetler",table:"customer_requests",fields:[["customer_id","Müşteri ID","text",1],["request_type","Tür","text",1],["title","Başlık","text",1],["description","Açıklama","textarea"],["status","Durum","text",1],["priority","Öncelik","text"]],cols:["request_type","title","status","priority","description"]},
after_sales:{title:"Teslimat / Satış Sonrası",table:"after_sales",fields:[["customer_id","Müşteri ID","text",1],["sale_id","Satış ID","text",1],["delivery_date","Teslim Tarihi","date"],["delivery_status","Teslimat Durumu","text",1],["customer_satisfaction","Müşteri Memnuniyeti","text"],["follow_up_date","Takip Tarihi","date"],["notes","Notlar","textarea"]],cols:["delivery_status","customer_satisfaction","follow_up_date","notes"]}
};

async function boot(){
if(!C||!C.supabaseUrl||!C.supabaseKey||C.supabaseKey==="BURAYA_PUBLISHABLE_KEY"){loginMsg("config.js içinde Publishable key eksik.");return}
client=supabase.createClient(C.supabaseUrl,C.supabaseKey);
const {data}=await client.auth.getSession(); if(data.session) showApp();
client.auth.onAuthStateChange((_e,s)=>s?showApp():showLogin());
}
function showLogin(){$("app").classList.add("hidden");$("login").classList.remove("hidden")}
async function showApp(){$("login").classList.add("hidden");$("app").classList.remove("hidden");await loadTab(currentTab);updateStats()}
$("loginBtn").onclick=async()=>{
loginMsg("Giriş yapılıyor...");
const {error}=await client.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
if(error)loginMsg(error.message);
};
$("logout").onclick=()=>client.auth.signOut();
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>loadTab(b.dataset.tab));

async function loadTab(tab){
currentTab=tab;document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
const d=defs[tab];let h="<h2>"+d.title+"</h2><form id='form'><div class='grid'>";
for(const [n,l,t,r] of d.fields)h+="<div><label>"+l+"</label>"+(t==="textarea"?`<textarea id="f_${n}" ${r?"required":""}></textarea>`:`<input id="f_${n}" type="${t}" ${r?"required":""}>`)+"</div>";
h+="</div><button style='margin-top:14px'>Kaydet</button></form><div id='tableWrap'><p class='muted'>Yükleniyor...</p></div>";
$("panel").innerHTML=h;$("form").onsubmit=async e=>{e.preventDefault();await insertRow(d)};await renderRows(d);
}
async function insertRow(d){
let o={};for(const [n] of d.fields){const v=$("f_"+n).value;if(v!=="")o[n]=v}
if(o.sale_price)o.sale_price=Number(o.sale_price);if(o.amount)o.amount=Number(o.amount);
const {error}=await client.from(d.table).insert(o);if(error){alert("Kayıt eklenemedi: "+error.message);return}
$("form").reset();await renderRows(d);updateStats();
}
async function renderRows(d){
let q=client.from(d.table).select("*");if(d.table!=="communications")q=q.order("created_at",{ascending:false});else q=q.order("communication_date",{ascending:false});
const {data,error}=await q.limit(100);
if(error){$("tableWrap").innerHTML="<div class='msg'>Tablo okunamadı: "+esc(error.message)+"</div>";return}
if(!data?.length){$("tableWrap").innerHTML="<p class='muted'>Henüz kayıt yok.</p>";return}
let h="<table><thead><tr>"+d.cols.map(c=>"<th>"+esc(c)+"</th>").join("")+"</tr></thead><tbody>";
for(const r of data)h+="<tr>"+d.cols.map(c=>"<td>"+esc(r[c])+"</td>").join("")+"</tr>";h+="</tbody></table>";$("tableWrap").innerHTML=h;
}
async function updateStats(){
for(const [id,t] of [["countCustomers","customers"],["countProjects","projects"],["countSales","sales"]]){const {count}=await client.from(t).select("*",{count:"exact",head:true});$(id).textContent=count??0}
}
boot();
</script>
</body>
</html>
