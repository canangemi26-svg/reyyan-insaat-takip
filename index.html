let db=seed, currentUser=null, page="dashboard", supa=null, remoteMode=false, syncing=false;
function localLoad(){try{return JSON.parse(localStorage.getItem(KEY))||seed}catch(e){return seed}}
function localSave(){localStorage.setItem(KEY,JSON.stringify(db))}
function cloudConfigured(){return !!(window.REYYAN_CONFIG&&REYYAN_CONFIG.supabaseUrl&&REYYAN_CONFIG.supabaseKey&&REYYAN_CONFIG.supabaseUrl.indexOf("your-project")<0)}
async function initCloud(){
 if(!cloudConfigured()){db=localLoad();return false}
 supa=window.supabase.createClient(REYYAN_CONFIG.supabaseUrl,REYYAN_CONFIG.supabaseKey);
 const {data,error}=await supa.from("company_state").select("id,state").eq("id","reyyan").maybeSingle();
 if(error) throw error;
 if(data&&data.state){db=data.state;localSave()}
 else {db=seed; await supa.from("company_state").upsert({id:"reyyan",state:db,updated_by:null,updated_at:new Date().toISOString()});}
 remoteMode=true;
 return true;
}
async function save(){
 localSave();
 if(!remoteMode||!supa||syncing)return;
 syncing=true;
 try{await supa.from("company_state").upsert({id:"reyyan",state:db,updated_by:(await supa.auth.getUser()).data.user?.id||null,updated_at:new Date().toISOString()});}finally{syncing=false}
}
async function enter(){
 const msg=document.getElementById("loginMsg"); msg.textContent="Giriş yapılıyor…";
 if(!cloudConfigured()){msg.textContent="Bulut bağlantısı henüz yapılandırılmamış. Yerel demo açılıyor.";db=localLoad();currentUser=document.getElementById("loginEmail").value||"Canan Akbaş";document.getElementById("login").style.display="none";document.getElementById("who").innerHTML=currentUser;renderNav();go("dashboard");return}
 const email=document.getElementById("loginEmail").value.trim(), password=document.getElementById("loginPassword").value;
 const {data,error}=await supa.auth.signInWithPassword({email,password});
 if(error){msg.textContent="Giriş başarısız: "+error.message;return}
 const u=data.user;
 const person=db.users.find(x=>String(x.email||"").toLowerCase()===email.toLowerCase()) || db.users.find(x=>String(x.name||"").toLowerCase()===String(u.user_metadata?.name||"").toLowerCase());
 currentUser=person?.name||u.email;
 document.getElementById("login").style.display="none";
 document.getElementById("who").innerHTML=currentUser+" <span class='muted'>• "+(person?.role||"Kullanıcı")+"</span>";
 renderNav();go("dashboard");
 supa.channel("reyyan-company-state").on("postgres_changes",{event:"UPDATE",schema:"public",table:"company_state",filter:"id=eq.reyyan"},payload=>{if(payload.new?.state){db=payload.new.state;localSave(); if(!syncing) {renderNav(); go(page);}}}).subscribe();
}
function renderNav(){
 const items=[["dashboard","🏠 Yönetim Paneli"],["crm","👥 CRM / Müşteriler"],["funnel","🎯 Satış Hunisi"],["units","🏢 Daire / Villa Stoku"],["sales","💰 Satışlar"],["finance","📊 Finans / Tahsilat"],["tasks","⏰ Takip & Görevler"],["construction","🏗️ İnşaat Yönetimi"],["procurement","📦 Satın Alma / Tedarikçi"],["service","🤝 Müşteri Hizmetleri"],["documents","📁 Evraklar"],["reports","📈 Raporlar"],["staff","👤 Personel"],["settings","⚙️ Ayarlar / Yedekleme"]];
 document.getElementById("nav").innerHTML=items.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")
}
function go(p){page=p;document.getElementById("title").textContent=({dashboard:"Yönetim Paneli",crm:"CRM / Müşteriler",funnel:"Satış Hunisi",units:"Daire / Villa Stoku",sales:"Satışlar",finance:"Finans / Tahsilat",tasks:"Takip & Görevler",construction:"İnşaat Yönetimi",procurement:"Satın Alma / Tedarikçi",service:"Müşteri Hizmetleri",documents:"Evraklar",reports:"Raporlar",staff:"Personel",settings:"Ayarlar / Yedekleme"})[p];renderNav();({dashboard,crm,funnel,units,sales,finance,tasks,construction,procurement,service,documents,reports,staff,settings}[p])();window.scrollTo(0,0)}
function money(n){return new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function card(label,num,sub=""){return `<div class="card metric"><div class="label">${label}</div><div class="num">${num}</div><div class="sub">${sub}</div></div>`}
function table(headers,rows){return `<div class="tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Kayıt yok</td></tr>`}</tbody></table></div>`}
function btn(txt,fn,cl="btn"){return `<button class="${cl}" onclick="${fn}">${txt}</button>`}

 const sold=db.units.filter(u=>u.status==="Satıldı").length;
 document.getElementById("content").innerHTML=`

function showModal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function form(fields,savefn){
 return `<div class="formgrid">${fields.map(f=>{
  const cls=f.full?'full':'';
  const label=esc(f.label);
  if(f.type==="textarea") return `<div class="${cls}"><label>${label}</label><textarea id="f_${f.id}" rows="3">${esc(f.value||"")}</textarea></div>`;
  if(f.type==="select") return `<div class="${cls}"><label>${label}</label><select id="f_${f.id}">${(f.options||[]).map(o=>`<option ${o===f.value?'selected':''}>${esc(o)}</option>`).join("")}</select></div>`;
  return `<div class="${cls}"><label>${label}</label><input class="input" id="f_${f.id}" type="${f.type||'text'}" value="${esc(f.value||"")}"></div>`;
 }).join("")}</div><div class="actions">${btn("İptal","closeModal()","btn gray")}${btn("Kaydet",savefn)}</div>`
}

function exportCSV(type){const arr=db[type]||[];const keys=[...new Set(arr.flatMap(o=>Object.keys(o)))];const csv=[keys.join(";"),...arr.map(o=>keys.map(k=>`"${String(o[k]??"").replaceAll('"','""')}"`).join(";"))].join("\\n");download("reyyan_"+type+".csv","text/csv;charset=utf-8;",csv)}
function download(name,type,data){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\\ufeff"+data],{type}));a.download=name;a.click()}
function backup(){download("reyyan_inşaat_v6_yedek.json","application/json",JSON.stringify(db,null,2))}
function restore(){const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();go(page);alert("Yedek geri yüklendi.")}catch(e){alert("Geçersiz JSON.")}};r.readAsText(i.files[0])};i.click()}
function resetDB(){if(confirm("Demo verisi silinsin mi?")){db=structuredClone(seed);save();go("dashboard")}}
